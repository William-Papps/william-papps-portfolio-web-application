<nav>
  <button data-view="home">Home</button>
  <button data-view="about">About</button>
</nav>

<main>
  <section id="home"><h2>Home</h2></section>
  <section id="about" hidden><h2>About</h2></section>
</main>

<script>
  const buttons = document.querySelectorAll("nav [data-view]");
  const sections = document.querySelectorAll("main > section");

  buttons.forEach((btn) =>
    btn.addEventListener("click", () => {
      const id = btn.dataset.view;
      sections.forEach((s) => (s.hidden = s.id !== id));
      history.pushState({ id }, "", `#${id}`); // BOM: update URL without reload
    }),
  );

  // Handle back/forward
  window.addEventListener("popstate", () => {
    const id = location.hash.replace("#", "") || "home";
    sections.forEach((s) => (s.hidden = s.id !== id));
  });
</script>
